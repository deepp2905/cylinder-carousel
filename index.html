<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Auto-Scaling Carousel</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Settings Toggle -->
    <button class="btn" id="settings-toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
    </button>

    <!-- Settings Modal -->
    <div id="settings-panel">
        <h3 class="panel-header">Carousel Configuration</h3>

        <div class="panel-scroll">
            <div class="control-group">
                <div class="control-label"><span>Camera Distance</span> <span class="control-val" id="val-cameraZ">12.0</span></div>
                <input type="range" id="param-cameraZ" min="6" max="25" value="12" step="0.5">
            </div>

            <div class="control-group">
                <div class="control-label"><span>Cylinder Radius</span> <span class="control-val" id="val-radius">3.5</span></div>
                <input type="range" id="param-radius" min="2" max="15" step="0.1" value="3.5">
            </div>

            <div class="control-group">
                <div class="control-label"><span>Image Height</span> <span class="control-val" id="val-height">2.2</span></div>
                <input type="range" id="param-height" min="1" max="5" step="0.1" value="2.2">
            </div>

            <hr>

            <label class="upload-global-btn">
                + Upload Images / Videos
                <input type="file" id="global-upload" multiple accept="image/*,video/*">
            </label>

            <div class="media-grid" id="media-grid"></div>
        </div>
    </div>

    <!-- Controls -->
    <div class="ui-overlay">
        <div class="nav-controls">
            <button class="btn" id="prev-btn"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
            <button class="btn" id="next-btn"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <div class="pagination-bar" id="pill"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "gsap": "https://cdn.skypack.dev/gsap"
            }
        }
    </script>
    <script type="module" src="carousel.js"></script>
</body>
</html>
