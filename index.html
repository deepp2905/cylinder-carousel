<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3d Cylinder Carousel in WebGL</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <button class="btn" id="settings-toggle">
        <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>

    <div id="settings-panel">
        <h3 class="panel-header">Carousel Configuration</h3>
        <div class="panel-scroll">

            <details class="settings-section" open>
                <summary class="section-header">Geometry & Camera</summary>
                <div class="section-body">
                    <div class="control-group">
                        <div class="control-label"><span>Camera Z Distance</span> <span class="control-val" id="val-cameraZ">8.0</span></div>
                        <input type="range" id="param-cameraZ" min="2" max="80" step="0.5" value="12.0">
                    </div>
                    <div class="control-group">
                        <div class="control-label"><span>Max Height</span> <span class="control-val" id="val-height">2.2</span></div>
                        <input type="range" id="param-height" min="1" max="5" step="0.1" value="2.2">
                    </div>
                    <div class="control-group">
                        <div class="control-label"><span>Padding Between Elements</span> <span class="control-val" id="val-padding">0.30</span></div>
                        <input type="range" id="param-padding" min="0" max="5" step="0.05" value="0.30">
                    </div>
                    <div class="control-group">
                        <div class="control-label"><span>Corner Radius</span> <span class="control-val" id="val-cornerRadius">0.05</span></div>
                        <input type="range" id="param-cornerRadius" min="0" max="0.5" step="0.01" value="0.05">
                    </div>
                </div>
            </details>

            <details class="settings-section">
                <summary class="section-header">Interface & Timing</summary>
                <div class="section-body">
                    <div class="control-group">
                        <div class="control-label"><span>Autoplay Timer</span> <span class="control-val" id="val-autoDur">3.0s</span></div>
                        <input type="range" id="param-autoDur" min="1" max="10" step="0.5" value="3">
                    </div>
                    <div class="control-group">
                        <div class="control-label"><span>Arrow Spacing (LR)</span> <span class="control-val" id="val-arrowPad">40px</span></div>
                        <input type="range" id="param-arrowPad" min="10" max="200" step="1" value="40">
                    </div>
                    <div class="control-group">
                        <div class="control-label"><span>Pill Bottom Margin</span> <span class="control-val" id="val-pillBottom">40px</span></div>
                        <input type="range" id="param-pillBottom" min="10" max="250" step="1" value="40">
                    </div>
                </div>
            </details>

            <details class="settings-section">
                <summary class="section-header">Audio Synthesis</summary>
                <div class="section-body">
                    <div class="control-group">
                        <div class="control-label"><span>Pitch Start (Hz)</span> <span class="control-val" id="val-audioHigh">140</span></div>
                        <input type="range" id="param-audioHigh" min="50" max="1000" step="10" value="140">
                    </div>
                    <div class="control-group">
                        <div class="control-label"><span>Pitch End (Hz)</span> <span class="control-val" id="val-audioLow">40</span></div>
                        <input type="range" id="param-audioLow" min="10" max="500" step="10" value="40">
                    </div>
                    <div class="control-group">
                        <div class="control-label"><span>Duration (ms)</span> <span class="control-val" id="val-audioDur">40</span></div>
                        <input type="range" id="param-audioDur" min="10" max="200" step="1" value="40">
                    </div>
                </div>
            </details>

            <details class="settings-section">
                <summary class="section-header">Media</summary>
                <div class="section-body">
                    <label class="upload-global-btn">
                        + Upload Images / Videos
                        <input type="file" id="global-upload" multiple accept="image/*,video/*">
                    </label>
                    <div class="media-grid" id="media-grid"></div>
                </div>
            </details>
        </div>
    </div>

    <div class="ui-overlay">
        <div class="nav-controls">
            <button class="btn" id="prev-btn"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
            <button class="btn" id="next-btn"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>

        <div class="bottom-controls">
            <button class="btn-small" id="autoplay-toggle">
                <svg viewBox="0 0 24 24" id="icon-pause"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
            </button>
            <div class="pagination-bar" id="pill"></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "framer-motion": "https://esm.sh/framer-motion@11.0.8"
            }
        }
    </script>
    <script type="module" src="carousel.js"></script>
</body>
</html>
